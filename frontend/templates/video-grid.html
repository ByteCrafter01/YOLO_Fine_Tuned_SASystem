<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Analysis Grid</title>
    <!-- Base styles -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base.css') }}"
    />
    <!-- Page-specific styles -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/dashboard.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/live-stream.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/video-grid.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/video-detail.css') }}"
    />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body>
    <div class="grid-container">
      <header class="dashboard-header">
        <h1>Video Analysis Grid</h1>
        <nav>
          <a href="/" class="nav-link">Dashboard</a>
          <a href="/live-stream" class="nav-link">Live Stream</a>
          <a href="/video-grid" class="nav-link active">Video Grid</a>
        </nav>
      </header>

      <div class="grid-content">
        <div class="grid-controls">
          <div class="filter-section">
            <select id="statusFilter">
              <option value="all">All Videos</option>
              <option value="processed">Processed</option>
              <option value="processing">Processing</option>
              <option value="violations">Has Violations</option>
            </select>
            <input
              type="text"
              id="searchInput"
              placeholder="Search videos..."
            />
          </div>

          <div class="upload-section">
            <input
              type="file"
              id="multiVideoUpload"
              accept="video/*"
              multiple
              style="display: none"
            />
            <button
              class="btn-primary"
              onclick="document.getElementById('multiVideoUpload').click()"
            >
              Upload Videos
            </button>
            <div id="uploadProgress" class="upload-progress"></div>
          </div>
        </div>

        <!-- Details View -->
        <div class="video-details-view" id="videoDetailsView">
          <div class="details-header">
            <div class="name-column">
              <i data-lucide="file-video"></i>
              <span>Name</span>
            </div>
            <div class="status-column">Status</div>
            <div class="duration-column">Duration</div>
            <div class="violations-column">Violations</div>
            <div class="date-column">Upload Date</div>
            <div class="size-column">File Size</div>
            <div class="actions-column">Actions</div>
          </div>
          <div class="details-body" id="videoDetailsBody">
            <div class="loading-placeholder">Loading videos...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal-overlay" id="deleteModal" style="display: none">
      <div class="modal">
        <h3>Confirm Delete</h3>
        <p id="deleteMessage">Are you sure you want to delete this video?</p>
        <div class="modal-actions">
          <button id="confirmDelete" class="btn-danger-delete">Delete</button>
          <button id="cancelDelete" class="btn-outline">Cancel</button>
        </div>
      </div>
    </div>
    <!-- Download Confirmation Modal -->
    <div class="modal-overlay" id="downloadModal" style="display: none">
      <div class="modal">
        <h3>Download Video</h3>
        <p id="downloadMessage">Ready to download this video?</p>
        <div class="download-info" id="downloadInfo">
          <!-- Video details will be populated here -->
        </div>
        <div class="modal-actions">
          <button id="confirmDownload" class="btn-primary">Download</button>
          <button id="cancelDownload" class="btn-outline">Cancel</button>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/video-grid.js') }}"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
